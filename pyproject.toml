[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothcommit"
version = "0.1.0"
description = "Let a local Gemma model write your commit messages and weekly reports. Offline, free, lazy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zhixin Qin" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["git", "commit", "gemma", "llama.cpp", "ollama", "local-llm", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.0"]
dev = ["pytest>=7"]

[project.scripts]
sloth = "slothcommit.cli:main"

[project.urls]
Homepage = "https://github.com/ziwenqingshu/slothcommit"

[tool.setuptools]
packages = ["slothcommit"]
